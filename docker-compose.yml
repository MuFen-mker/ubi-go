services:
  ubi-go:
    image: ubi-go
    container_name: ubi-go-container
    build:
      context: .
      dockerfile: ./Dockerfile
    ports:
      - "${API_PORT:-8080}:${API_PORT:-8080}"
    env_file:
      - .env
    environment:
      - ENV_VAR=production
    networks:
      - ubi-go-network
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1

networks:
  ubi-go-network:
    driver: bridge