name: Build UBI-Go Binary

on:
  push:
    branches: [ "origin" ]  # 推送到主分支时触发
  workflow_dispatch:                # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'  # 根据项目实际要求调整

      - name: Build for Linux
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o ubi-go .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ubi-go-linux-amd64
          path: ubi-go